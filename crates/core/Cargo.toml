[package]
name = "hldr-core"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["store"]
# SQLite materialization and markdown rendering, for the server. The CLI
# needs only the wire format and the manifest parser.
store = ["dep:chrono", "dep:comrak", "dep:hex", "dep:sha2", "dep:sqlx", "dep:libsqlite3-sys"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"], optional = true }
comrak = { version = "0.55.0", default-features = false, features = ["syntect-fancy"], optional = true }
hex = { version = "0.4.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = "1.0.0"
sha2 = { version = "0.11.0", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"], optional = true }
thiserror = "2.0.17"
libsqlite3-sys = { version = "0.37", features = ["bundled"], optional = true }
schemars = "1.2.2"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
