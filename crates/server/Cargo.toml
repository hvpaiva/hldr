[package]
name = "hldr-server"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
flate2 = "1.1.10"
hldr-core = { workspace = true, features = ["store"] }
maud = { version = "0.27.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
# Maps keep the order content wrote them in, as the CLI's do; without it a
# release build sorts them while tests, built with the CLI, do not.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite"] }
tower = { version = "0.5.3", features = ["util"] }
