version: 2

# Actions are pinned to SHAs and gems/crates to lockfiles; without updates
# the pins only age. One grouped PR per ecosystem per week. Prefixes keep
# the commits conventional, so a merged update is released as a patch.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
