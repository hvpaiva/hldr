name: deploy

# A push to main that changes a deployable input is a release: check, the
# image and the static CLI build in parallel, Kamal deploys the image, and
# vX.Y.Z is tagged, with the CLI attached, only once production is healthy.
# Tags are the version history; nothing is committed back. See
# .github/scripts/release-plan.

on:
  push:
    branches: [main]
  # Daily: retries a release that did not reach production, and fails (so
  # GitHub mails) when production runs something other than the last tag.
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Redeploy a released version (X.Y.Z) without building. Empty releases main.
        type: string
        required: false
        default: ""

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      deploy: ${{ steps.plan.outputs.deploy }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: git-cliff@2.14.2
      - id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: .github/scripts/release-plan
      - if: github.event_name == 'schedule' && steps.plan.outputs.release == 'false'
        env:
          RELEASED: ${{ steps.plan.outputs.version }}
        run: |
          live=$(curl -fsS --retry 3 https://hvpaiva.dev/healthz | jq -r .version)
          if [ "$live" != "$RELEASED" ]; then
            echo "::error::production runs $live; the last release is $RELEASED"
            exit 1
          fi

  check:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/hvpaiva/hldr:${{ needs.plan.outputs.version }}
          build-args: |
            HLDR_VERSION=${{ needs.plan.outputs.version }}
            HLDR_REVISION=${{ github.sha }}
          # Kamal refuses images without the service label.
          labels: |
            service=hldr
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The CLI a release ships: one static binary, since rustls is pure Rust
  # but for ring's C, which musl-gcc builds. Its checksum rides along, and
  # a Sigstore provenance attestation that install.sh verifies through gh.
  cli:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - env:
          HLDR_VERSION: ${{ needs.plan.outputs.version }}
          HLDR_REVISION: ${{ github.sha }}
        run: |
          cargo build --release --locked -p hldr --target "$TARGET"
          mkdir dist
          cp "target/$TARGET/release/hldr" "dist/hldr-$TARGET"
          "dist/hldr-$TARGET" version --client
          (cd dist && sha256sum "hldr-$TARGET" > "hldr-$TARGET.sha256")
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/hldr-${{ env.TARGET }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: dist/
          if-no-files-found: error

  deploy:
    needs: [plan, check, build, cli]
    # A redeploy skips check and the builds; a release needs them all.
    if: >-
      !cancelled() && needs.plan.outputs.deploy == 'true' &&
      (needs.plan.outputs.release != 'true' ||
      (needs.check.result == 'success' && needs.build.result == 'success' &&
      needs.cli.result == 'success'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hvpaiva.dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: mkdir -p ~/.ssh && cat config/known_hosts >> ~/.ssh/known_hosts
      # The host logs in to ghcr.io with this job's token, so it only reads packages.
      - run: bundle exec kamal deploy --skip-push --version "$VERSION"
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          HLDR_METRICS_TOKEN: ${{ secrets.HLDR_METRICS_TOKEN }}

  release:
    needs: [plan, deploy]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: git-cliff@2.14.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli
          path: ${{ runner.temp }}/cli
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The installer installs its own release unless told otherwise.
          sed "s/^readonly stamped='@HLDR_VERSION@'$/readonly stamped='$VERSION'/" install.sh \
            > "$RUNNER_TEMP/cli/install.sh"
          grep -qx "readonly stamped='$VERSION'" "$RUNNER_TEMP/cli/install.sh"
          git cliff --unreleased --tag "v$VERSION" --strip all > "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { printf 'v%s\n\n' "$VERSION"; cat "$RUNNER_TEMP/notes.md"; } |
            git tag -a "v$VERSION" -F - "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/cli/*
