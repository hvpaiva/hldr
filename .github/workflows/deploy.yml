name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hldr-deploy
  cancel-in-progress: false

jobs:
  kamal:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hvpaiva.dev
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: guard
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on origin/main" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: github.event_name == 'push'
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
        if: github.event_name == 'push'
      - if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cargo-binstall release-plz@0.3.169 --force --strategies=crate-meta-data,compile --no-confirm
          git checkout --force -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release-plz update
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            ver=$(awk '
              /^\[workspace.package\]/ { p=1; next }
              p && /^\[/ { exit }
              p && /^version =/ {
                gsub(/[" ]/, "")
                split($0, a, "=")
                print a[2]
                exit
              }
            ' Cargo.toml)
            git commit -m "chore: release v${ver}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          release-plz release --git-token "$GITHUB_TOKEN" --forge github
      - id: version
        run: |
          set -euo pipefail
          ver=$(awk '
            /^\[workspace.package\]/ { p=1; next }
            p && /^\[/ { exit }
            p && /^version =/ {
              gsub(/[" ]/, "")
              split($0, a, "=")
              print a[2]
              exit
            }
          ' Cargo.toml)
          if [ -z "$ver" ]; then
            echo "semver missing" >&2
            exit 1
          fi
          echo "semver=$ver" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "3.3"
      - run: gem install kamal -v 2.12.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_KEY }}
      - env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - run: kamal deploy --version "${{ steps.version.outputs.semver }}"
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          HLDR_ORIGIN: ${{ vars.HLDR_ORIGIN }}
          KAMAL_BIND_IPV4: ${{ vars.KAMAL_BIND_IPV4 }}
          KAMAL_BIND_IPV6: ${{ vars.KAMAL_BIND_IPV6 }}
