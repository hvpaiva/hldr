name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hldr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.filter.outputs.check }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          check=false
          deploy=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            check=true
            deploy=true
          else
            if [ "$EVENT" = "pull_request" ]; then
              range="${PR_BASE}...${PR_HEAD}"
            elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              check=true
              deploy=true
              range=""
            else
              range="${BEFORE}...${AFTER}"
            fi
            if [ -n "$range" ]; then
              while IFS= read -r f; do
                case "$f" in
                  crates/*|Cargo.toml|Cargo.lock|migrations/*|deny.toml)
                    check=true
                    deploy=true
                    ;;
                  content/*|Dockerfile|.dockerignore|config/*|.kamal/*)
                    deploy=true
                    ;;
                esac
              done < <(git diff --name-only "$range")
            fi
          fi
          echo "check=$check" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  check:
    needs: filter
    if: needs.filter.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --workspace -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2

  deploy:
    needs: [filter, check]
    if: |
      always() &&
      !cancelled() &&
      needs.filter.result == 'success' &&
      needs.filter.outputs.deploy == 'true' &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hvpaiva.dev
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install kamal -v 2.12.0
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.APOLLO_DEPLOY_KEY }}
      - run: mkdir -p ~/.ssh && cp .kamal/known_hosts ~/.ssh/known_hosts
      - run: kamal deploy
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
