service: hldr
image: hvpaiva/hldr

servers:
  - hvpaiva.dev

proxy:
  ssl: true
  host: hvpaiva.dev
  app_port: 8080
  healthcheck:
    path: /readyz
  run:
    bind_ips:
      - 72.61.46.31
      - "2a02:4780:66:5b90::1"
    log_max_size: ""

registry:
  server: ghcr.io
  username: hvpaiva
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  cache:
    type: gha
    options: mode=max

ssh:
  user: hvpaiva

env:
  clear:
    HLDR_ADDR: 0.0.0.0:8080
    HLDR_CONTENT_DIR: /app/content
    HLDR_DATABASE: /var/lib/hldr/hldr.db
    HLDR_ORIGIN: https://hvpaiva.dev
    HLDR_LOG: info

volumes:
  - /var/lib/hldr:/var/lib/hldr

logging:
  driver: json-file
  options:
    max-size: 10m

aliases:
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

minimum_version: 2.12.0
