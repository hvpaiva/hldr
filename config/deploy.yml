<% domain = "hvpaiva.dev" %>
service: hldr
image: hvpaiva/hldr

servers:
  - apollo.hvpaiva.dev

proxy:
  ssl: true
  host: <%= domain %>
  app_port: 8080
  healthcheck:
    path: /readyz

registry:
  server: ghcr.io
  username: hvpaiva
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: deploy

env:
  clear:
    HLDR_ORIGIN: https://<%= domain %>
    HLDR_CONTENT_REPO: hvpaiva/hldr-content
    # apollo serves this socket to the tailnet at :8443, and nowhere else.
    HLDR_API_ADDR: unix:/run/tailnet/8443.sock
    HLDR_METRICS_REPO: hvpaiva/hldr-metrics
  secret:
    - HLDR_METRICS_TOKEN

volumes:
  - hldr_data:/var/lib/hldr
  - /run/tailnet:/run/tailnet

aliases:
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

minimum_version: 2.12.0
