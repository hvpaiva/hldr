<% domain = "hvpaiva.dev" %>
service: hldr
image: hvpaiva/hldr

servers:
  - apollo.hvpaiva.dev

proxy:
  ssl: true
  host: <%= domain %>
  app_port: 8080
  healthcheck:
    path: /readyz

registry:
  server: ghcr.io
  username: hvpaiva
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: deploy

env:
  clear:
    HLDR_ORIGIN: https://<%= domain %>

volumes:
  - hldr_data:/var/lib/hldr

aliases:
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

minimum_version: 2.12.0
