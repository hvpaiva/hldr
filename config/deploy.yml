service: hldr
image: hvpaiva/hldr

servers:
  - 72.61.46.31

proxy:
  ssl: true
  host: hvpaiva.dev
  app_port: 8080
  healthcheck:
    path: /readyz

registry:
  server: ghcr.io
  username: hvpaiva
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  cache:
    type: gha
    options: mode=max

ssh:
  user: deploy

env:
  clear:
    HLDR_ADDR: 0.0.0.0:8080
    HLDR_CONTENT_DIR: /app/content
    HLDR_DATABASE: /var/lib/hldr/hldr.db
    HLDR_ORIGIN: <%= ENV.fetch("HLDR_ORIGIN") %>
    HLDR_LOG: info

volumes:
  - hldr_data:/var/lib/hldr

aliases:
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

minimum_version: 2.12.0
