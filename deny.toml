[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "syntect still loads Sublime syntaxes with yaml-rust" },
    { id = "RUSTSEC-2025-0141", reason = "syntect still serializes syntax sets with bincode 1.3.3" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
